template_id: camera.hitchcock_zoom.v1
agent: CamAgent
domain: camera
ue_version: '5.5'
description: Create a Hitchcock zoom shot using coupled transform and focal-length
  keys.
operation_type: camera.hitchcock_zoom
inputs_schema:
  sequence_path: str
  camera_name: str
  target_actor: str
  keys: list
preconditions:
- sequence_exists
- target_actor_exists
postconditions:
- cameras_exist
- camera_transform_keys_min
- focal_length_keys_min
safety:
  allowed_imports:
  - cineu_camera_ops
  - cineu_verify_ops
rollback:
  delete_created_camera: true
script: 'from cineu_camera_ops import create_camera_shot

  from cineu_verify_ops import dump_world_state_to_file


  PARAMS = {{ params_json }}

  OUTPUT = create_camera_shot(PARAMS["inputs"])

  dump_world_state_to_file(PARAMS["context"]["world_state_path"], PARAMS, OUTPUT)

  '

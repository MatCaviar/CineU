template_id: sequence.use_existing.v1
agent: SeqAgent
domain: sequencer
ue_version: '5.5'
description: Reuse an existing Level Sequence asset without recreating or overwriting it.
operation_type: sequence.use_existing
inputs_schema:
  sequence_path: str
  sequence_asset: dict
  shot_id: str
preconditions: []
postconditions:
- sequence_exists
safety:
  allowed_imports:
  - cineu_sequence_ops
  - cineu_verify_ops
rollback: {}
script: 'from cineu_sequence_ops import use_existing_level_sequence

  from cineu_verify_ops import dump_world_state_to_file


  PARAMS = {{ params_json }}

  OUTPUT = use_existing_level_sequence(PARAMS["inputs"])

  dump_world_state_to_file(PARAMS["context"]["world_state_path"], PARAMS, OUTPUT)

  '

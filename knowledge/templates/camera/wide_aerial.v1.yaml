template_id: camera.wide_aerial.v1
agent: CamAgent
domain: camera
ue_version: '5.5'
description: Create an elevated wide shot with transform/lens tracks.
operation_type: camera.wide_aerial
inputs_schema:
  sequence_path: str
  camera_name: str
  keys: list
preconditions:
- sequence_exists
postconditions:
- cameras_exist
safety:
  allowed_imports:
  - cineu_camera_ops
  - cineu_verify_ops
rollback:
  delete_created_camera: true
script: 'from cineu_camera_ops import create_camera_shot

  from cineu_verify_ops import dump_world_state_to_file


  PARAMS = {{ params_json }}

  OUTPUT = create_camera_shot(PARAMS["inputs"])

  dump_world_state_to_file(PARAMS["context"]["world_state_path"], PARAMS, OUTPUT)

  '
